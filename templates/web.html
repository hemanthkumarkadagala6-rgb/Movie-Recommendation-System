
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies Recommendation</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: black;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 15px;
      border: none;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }
    .form-control {
      border-radius: 30px;
      padding: 12px 20px;
    }
    .btn-custom {
      border-radius: 30px;
      background: #00c6ff;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: #fff;
      font-weight: 500;
      transition: 0.3s;
    }
    .btn-custom:hover {
      background: linear-gradient(45deg, #0072ff, #00c6ff);
      transform: scale(1.05);
    }
    ul {
      list-style: none;
      padding: 0;
    }
    ul li {
      background: rgba(255, 255, 255, 0.15);
      color:white;
      padding: 12px 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      transition: 0.3s;
    }
    ul li:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateX(5px);
    }
    h2 {
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      color: #00c6ff;
    }
    h5{
        color: rgb(136, 79, 193);
    }
    .color{
      width: 30%;
      border-radius: 25px;
      border: rgba(17, 2, 2, 0);
      color: rgb(4, 1, 1);
      font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4">
          <h2>🎬 Movie Recommendations</h2>
          <button class="color" >White</button>
          <form action="{{url_for('recommended')}}" method="POST" class="d-flex gap-2">
            <input type="text" class="form-control" placeholder="Enter a movie you love..." name="cinema" id="movieInput">
            <button type="submit" class="btn btn-custom" id="bttn">Search</button>
          </form>

          {% if res %}
          <div class="mt-4">
            <h5>✨ Recommended Movies for You:</h5>
            <ul>
              {% for m in res %}
              <li>{{m}}</li>
              {% endfor %}
            </ul>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Your custom JS -->
<script>
  const og = document.querySelector("#bttn");
  const input = document.querySelector("#movieInput");

  og.addEventListener("click", event => {
    if (input.value.trim() === '') {
      event.preventDefault();
      alert("Text your favorite Movie");
    }
  });

  let colo = document.querySelector('.color');
  colo.addEventListener('click', () => {
    // Use computed style to avoid mismatch with CSS defaults
    const current = getComputedStyle(document.body).backgroundColor;

    if (current === 'rgb(0, 0, 0)') { // black
      document.body.style.backgroundColor = 'white';
      colo.textContent = 'Black';
    } else {
      document.body.style.backgroundColor = 'black';
      colo.textContent = 'White';
    }
  });
</script>
</body>
</html>
